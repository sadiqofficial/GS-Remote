name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch needed submodules
        run: |
          git submodule update --init --recursive --depth 1 -- \
            third-party/nanopb \
            third-party/jerasure \
            third-party/gf-complete \
            third-party/curl \
            third-party/mbedtls \
            third-party/json-c \
            third-party/miniupnp \
            android/app/src/main/cpp/oboe

      - name: Install build tools (protoc, python protobuf)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-protobuf ninja-build
          protoc --version
          python3 -c "import google.protobuf; print('python protobuf OK')"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK, CMake and platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon --console=plain --warning-mode none > build_output.txt 2>&1 || {
            echo "=============== FIRST ERRORS ==============="
            grep -n -m 3 -B2 -A8 -E "What went wrong|CMake Error|error:|^e: " build_output.txt
            echo "=============== LAST 25 LINES ==============="
            tail -n 25 build_output.txt
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: gsremote-debug-apk
          path: android/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
